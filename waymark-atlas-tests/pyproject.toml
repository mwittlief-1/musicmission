[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waymark-atlas-tests"
version = "0.1.0"
description = "Waymark Atlas ingestion and digest test harness"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
validation = ["jsonschema>=4.0"]

[project.scripts]
waymark-atlas-tests = "waymark_atlas_tests.run_atlas_ingestion_tests:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
